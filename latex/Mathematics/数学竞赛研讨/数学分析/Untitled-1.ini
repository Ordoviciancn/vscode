\section*{问题8：实验室培养真菌甲、真菌乙和细菌丙的数学模型}

\subsection*{假设}
\begin{itemize}
    \item 真菌甲（A）、真菌乙（B）和细菌丙（C）的数量用时间函数 \(A(t)\)、\(B(t)\)、\(C(t)\) 表示。
    \item 真菌甲的生长率与真菌乙的数量成正比（互利共生）。
    \item 真菌乙的死亡率与细菌丙的数量成正比。
    \item 所有种群的增长均受自身承载能力限制。
\end{itemize}

\subsection*{数学模型}
基于Lotka-Volterra模型和互利共生模型，建立以下微分方程组：
\begin{align}
    \frac{dA}{dt} &= r_A A \left(1 - \frac{A}{K_A}\right) + \lambda A B \\
    \frac{dB}{dt} &= r_B B \left(1 - \frac{B}{K_B}\right) - \mu B C \\
    \frac{dC}{dt} &= r_C C \left(1 - \frac{C}{K_C}\right)
\end{align}
其中：
\begin{itemize}
    \item \(r_A, r_B, r_C\) 分别为真菌甲、真菌乙和细菌丙的内在增长率。
    \item \(K_A, K_B, K_C\) 分别为真菌甲、真菌乙和细菌丙的承载能力。
    \item \(\lambda\) 为真菌乙对真菌甲的增长促进系数（互利系数）。
    \item \(\mu\) 为细菌丙对真菌乙的死亡率增加系数。
\end{itemize}

\subsection*{建模依据}
\begin{itemize}
    \item 模型基于种群生态学中的逻辑增长模型，考虑种群自我限制。
    \item 真菌甲与真菌乙的互利关系通过项 \(\lambda A B\) 体现。
    \item 细菌丙对真菌乙的负面影响通过项 \(-\mu B C\) 体现。
    \item 细菌丙的增长假设为逻辑增长，简化了系统。
\end{itemize}
