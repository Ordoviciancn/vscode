	\section*{问题3：Q值法分配席位}
\textbf{计算标准配额：}
\begin{align*}
    \text{每个席位代表人口数} &= \frac{165}{16} \approx 10.3125 \\
    \text{甲方标准配额} &= \frac{70}{10.3125} \approx 6.7879 \rightarrow \text{至少6席} \\
    \text{乙方标准配额} &= \frac{95}{10.3125} \approx 9.2121 \rightarrow \text{至少9席}
\end{align*}
初始分配：甲方6席、乙方9席，总计15席，剩余1席待分配。

\noindent
\textbf{计算Q值决定剩余席位：}
Q值公式：$Q = \frac{P}{\sqrt{n(n+1)}}$，其中$P$为人口数，$n$为当前席位数。
\begin{align*}
    \text{甲方当前}n=6: Q_{\text{甲}} &= \frac{70}{\sqrt{6 \times 7}}  \approx 10.801 \\
    \text{乙方当前}n=9: Q_{\text{乙}} &= \frac{95}{\sqrt{9 \times 10}} \approx 10.014
\end{align*}
比较Q值：$Q_{\text{甲}} (10.801) > Q_{\text{乙}} (10.014)$，因此剩余席位分配给甲方。

\noindent
\textbf{最终分配}应为甲方7席，乙方9席，总计16席。

\section*{问题4：季节性过敏成因的数学模型}

为了确定中国儿童季节性过敏就诊数量增加的成因，需要收集多维度数据并建立合适的数学模型。

\subsection*{应收集的数据：}
\begin{enumerate}
    \item \textbf{健康数据：}
    \begin{itemize}
        \item 时间序列的儿童过敏就诊数量（如每月或每年就诊人次）。
        \item 儿童人口数据（用于计算就诊率，如每千儿童就诊率）。
        \item 患者个体数据（如年龄、性别、居住地），以控制混杂因素。
    \end{itemize}
    \item \textbf{环境数据：}
    \begin{itemize}
        \item 过敏原植物数据：花粉浓度（如季节性花粉计数）、植物分布变化。
        \item 污染数据：空气污染指数（PM2.5、NO2、SO2、O3等）、化学污染物浓度。
        \item 生物数据：昆虫或鸟类数量变化（如蚊子、螨虫、鸟类迁徙数据）。
    \end{itemize}
    \item \textbf{社会行为数据：}
    \begin{itemize}
        \item 卫生习惯指标：如洗手频率、家庭清洁产品使用量、抗生素使用率。
        \item 免疫力相关指标：疫苗接种覆盖率、肠道微生物组数据（如通过 surveys 或医疗记录）。
        \item 城市化指标：绿地面积、人口密度、住房类型。
    \end{itemize}
    \item \textbf{气候数据：}
    \begin{itemize}
        \item 温度、湿度、降水量等季节性变化，可能影响过敏原扩散。
    \end{itemize}
\end{enumerate}

\subsection*{数学模型：}
建议建立\textbf{多元时间序列回归模型}或\textbf{面板数据模型}，以处理时间依赖性和多个变量。具体步骤：
\begin{itemize}
    \item \textbf{变量定义：}
    \begin{itemize}
        \item 因变量：儿童过敏就诊率（如对数转换后的计数数据）。
        \item 自变量：上述环境、社会、气候指标（可能需滞后处理以捕捉延迟效应）。
    \end{itemize}
    \item \textbf{模型选择：}
    \begin{itemize}
        \item \textbf{Poisson回归或负二项回归}：因就诊数量为计数数据，可能过度分散，负二项回归更合适。
        \item \textbf{线性混合模型}：如果数据具有层次结构（如不同城市或地区），加入随机效应。
        \item \textbf{结构方程模型 (SEM)}：如果成因涉及多重路径（如污染间接影响健康通过植物），SEM 可测试复杂因果关系。
    \end{itemize}
    \item \textbf{模型验证：}
    \begin{itemize}
        \item 使用时间序列分析（如ARIMA）处理自相关。
        \item 进行变量选择（如LASSO回归）以避免过拟合。
        \item 计算指标如AIC/BIC、R²评估模型拟合度。
    \end{itemize}
    \item \textbf{因果推断：}
    \begin{itemize}
        \item 利用格兰杰因果检验或干预分析（如政策变化）增强因果性。
    \end{itemize}
\end{itemize}

通过模型参数估计和假设检验，可以识别显著影响因素（如花粉浓度或卫生习惯），并量化其影响程度，从而确定成因。
