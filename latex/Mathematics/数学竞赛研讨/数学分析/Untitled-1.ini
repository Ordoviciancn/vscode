\section*{问题7：微分方程组的平衡点与稳定性分析}
对于微分方程组：
\[
\begin{cases}
x'(t) = 2x + 3y \\
y'(t) = x - y
\end{cases}
\]

\paragraph{步骤1：求平衡点}
平衡点满足 \( x'(t) = 0 \) 且 \( y'(t) = 0 \)，解方程组：
\[
\begin{cases}
2x + 3y = 0 \\
x - y = 0
\end{cases}
\]
由 \( x = y \) 代入第一个方程，得 \( 5x = 0 \implies x = 0, \, y = 0 \)。
故平衡点为 \((0, 0)\)。

\paragraph{步骤2：特征值分析判断稳定性}
将方程组表示为矩阵形式 \( \mathbf{x}' = A\mathbf{x} \)，其中系数矩阵 \( A = \begin{pmatrix} 2 & 3 \\ 1 & -1 \end{pmatrix} \)。

计算特征方程 \( \det(A - \lambda I) = 0 \)：
\[
\det\begin{pmatrix} 2 - \lambda & 3 \\ 1 & -1 - \lambda \end{pmatrix} = (2 - \lambda)(-1 - \lambda) - 3 = \lambda^2 - \lambda - 5 = 0
\]
解得特征值：
\[
\lambda = \frac{1 \pm \sqrt{21}}{2}
\]

由于特征值 \( \lambda_1 = \frac{1 + \sqrt{21}}{2} \) 的实部为正，因此平衡点 \((0, 0)\) 不稳定。
